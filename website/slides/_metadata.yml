# ─────────────────────────────────────────────────────────────────────────────
# Shared options for EVERY deck in this directory (STYLE.md §5.4).
#
# The 2026 spring iteration duplicated this block in all 13 decks and they drifted
# apart (code-fold: true vs show, cache on some weeks only). Set it once, here.
# A deck's own YAML carries its `title:` and nothing else. The checker enforces
# that (E041).
# ─────────────────────────────────────────────────────────────────────────────

author: Tristan Muno
date: last-modified
date-format: MMMM D, YYYY

# The Mannheim palace behind every deck's title slide. Path is relative to this file,
# which sits in the same directory as the decks. This is a DOWNSCALED derivative of
# images/uma_palace.png (2.8 MB): embed-resources inlines the background as base64 into
# every deck, so the full-size original would cost roughly 3.7 MB per week.
# The opacity is what keeps the dark blue title, author and date readable over the sky.
title-slide-attributes:
  data-background-image: images/uma-palace-title.jpg
  data-background-size: cover
  data-background-opacity: "0.35"

format:
  revealjs:
    theme: theme.scss
    # Every 2026 spring deck declared this in its own YAML. It belongs here instead,
    # beside the .slide-logo rule in theme.scss that sizes and positions it. The path is
    # relative to this file, which sits in the same directory as the decks.
    logo: images/uma_ss.png
    # Decks are downloaded and shown offline, so inline everything.
    embed-resources: true
    preview-links: false
    slide-number: true
    incremental: true
    code-fold: true
    code-summary: "View source"
    # Keep a fragmented slide on ONE printed page. The fit check (STYLE.md §6)
    # measures print-pdf layout, so this also keeps the check honest.
    pdfSeparateFragments: false
    footer: "QMIR -- {{< meta date >}}"
    # Canvas is reveal's 1050x700 default, stated in STYLE.md §5.1 and asserted
    # by automation/check-slide-fit.R. Do not override width/height per deck.

execute:
  echo: true
  message: false
  warning: false
  freeze: auto
