# -----------------------------------------------------------------------------
# The course glossary, as data. Rendered alphabetically by website/glossary.qmd.
#
# What goes in:
#   Concepts only: object, function, tidy data, join, commit. NO entries for single
#   R functions such as filter() or summary(). A function may appear INSIDE a concept's
#   definition as an example, never as an entry of its own.
#   Only weeks whose deck is live. When a week goes live, add every concept from its
#   slides AND its homework that is new to someone learning this from scratch.
#
# Fields:
#   term:  as it should be displayed. Package names and code in backticks.
#          Start with a letter, so the term files under the A to Z jump bar.
#   week:  the week in which students FIRST meet the term, in a live deck or a released
#          homework (not folded code, not speaker notes). Week 1's worked Bayesian
#          example is a preview and does not count: its terms wait for their real week.
#          The page derives the block name from `blocks:` in course.yml, and stops the
#          render on a missing or out-of-range week.
#   tags:  one or more from the CLOSED vocabulary below. glossary.qmd stops the
#          render on an unknown tag, so the tag set cannot sprawl the way the slide
#          font sizes did in the previous course iteration.
#          workflow quarto git r data probability model prior mcmc diagnostics
#          regression multilevel interpretation
#   def:   one or two sentences, ONE SENTENCE PER LINE (.claude/writing.md).
#   id:    optional. Every entry gets the anchor gl-<term as a slug>, for example
#          "Tidy data" is gl-tidy-data and "`NA`" is gl-na. Set id: only to keep an
#          old anchor alive after renaming a term.
#   see:   optional list of entry ids, rendered as a "See also" line.
#   docs:  optional {url, label}, rendered as a "Documentation" link. OFFICIAL sources
#          only: r-project.org and its manuals, tidyverse.org, quarto.org,
#          positron.posit.co, git-scm.com, docs.github.com, the package's own site.
#
# Linking: inside a def, write [text](#gl-id). A link to an id that does not exist,
# in a def or under see:, stops the render.
#
# Voice: statistical terms are framed as learning from data (the estimand is what we
# want to learn, the estimator how, the estimate what we get). Software terms follow
# the tool's own documentation, not a slide example.
#
# .claude/writing.md applies here as everywhere: no em dashes, no en dashes, no semicolons.
# No frequentist framing (.claude/course-design.md).
#
# Order in this file does not matter. The page sorts alphabetically. Entries are
# grouped by week here only so a new week's terms are easy to check off.
# -----------------------------------------------------------------------------

# --- Week 1: Introduction ----------------------------------------------------
# Statistics in a nutshell and the normal-distribution recap. The applied Bayesian
# example of week 1 is a preview, so its terms are not entered here.

- term: "Estimand"
  week: 1
  tags: [workflow, interpretation]
  def: |
    The quantity we want to learn about from data, such as the association between two variables, stated precisely before any analysis.
    Naming it first is what keeps the [estimator](#gl-estimator) and the [estimate](#gl-estimate) answerable to a question.

- term: "Estimator"
  week: 1
  tags: [workflow, model]
  def: |
    The procedure, our method, that turns data into an [estimate](#gl-estimate) of the [estimand](#gl-estimand).
    The same estimand can be approached with different estimators, so the choice is one you have to justify.

- term: "Estimate"
  week: 1
  tags: [interpretation]
  def: |
    The output of the [estimator](#gl-estimator): the result we get back once the method has been applied to the data.
    Ideally it corresponds to the [estimand](#gl-estimand), and checking how far it does is part of every analysis.

- term: "Inference"
  week: 1
  tags: [probability, interpretation]
  def: |
    Learning from data: using what we have observed to say something about what we have not.
    Measuring two variables to learn about their association, or sampling people to learn about a population, are both inference.
  see: [gl-estimand, gl-signal-and-noise]

- term: "Signal and noise"
  week: 1
  tags: [probability, interpretation]
  def: |
    Signal is the real pattern in the world that we want to learn about, and noise is random variation from measurement or data collection.
    Telling the two apart, and saying how certain we can be that we have, is the fundamental task of learning from data.

- term: "Probability distribution"
  week: 1
  tags: [probability]
  def: |
    A description of how plausible each possible value of a quantity is.
    For a continuous quantity it is drawn as a [density](#gl-probability-density) curve, and the area under the curve between two values is the probability of landing between them.

- term: "Probability density"
  week: 1
  tags: [probability]
  def: |
    The height of the curve of a continuous [probability distribution](#gl-probability-distribution).
    The density itself is not a probability: the area under the curve between two values is.

- term: "Normal distribution"
  week: 1
  tags: [probability]
  def: |
    The symmetric bell-shaped distribution, written $\mathcal{N}(\mu, \sigma)$ in this course.
    It has exactly two knobs, the [mean and the standard deviation](#gl-mean-and-standard-deviation), and no other shape is available.
  see: [gl-rule-of-68-and-95-percent, gl-standard-normal-distribution]

- term: "Mean and standard deviation"
  week: 1
  tags: [probability, data]
  def: |
    The mean $\mu$ is the centre of a distribution, and moving it slides a normal curve left or right.
    The standard deviation $\sigma$ is its spread, and raising it makes the curve wider and flatter.

- term: "Rule of 68 and 95 percent"
  week: 1
  tags: [probability]
  def: |
    For any [normal distribution](#gl-normal-distribution), about 68 percent of the probability lies within one standard deviation of the mean, and about 95 percent within two.
    It is why $\mathcal{N}(5, 2)$ reads as "5, plus or minus about 4".

- term: "Standard normal distribution"
  week: 1
  tags: [probability]
  def: |
    The normal distribution with mean 0 and standard deviation 1, $\mathcal{N}(0, 1)$.
    Every other normal distribution is that same shape, shifted and stretched, which is what [standardising](#gl-standardising) undoes.

- term: "Standardising"
  week: 1
  tags: [probability, data]
  def: |
    Subtracting the mean and dividing by the standard deviation, $z_i = (x_i - \mu) / \sigma$, which turns any normal variable into a standard normal one.
    A value of $z_i = 2$ then means the same thing everywhere: two standard deviations above the mean.

# --- Week 2: Quarto, Git and GitHub ------------------------------------------

- term: "Positron"
  week: 2
  tags: [workflow]
  def: |
    A free data science environment, an IDE (integrated development environment), for R and Python, and the editor this course works in.
    By default the editor sits above the [console](#gl-console) and the [terminal](#gl-terminal), with the Variables and Plots panes on the right and views such as the Explorer and [Source Control](#gl-source-control-pane) in the Activity Bar.
  docs:
    url: "https://positron.posit.co/layout.html"
    label: "Positron: layout"

- term: "Terminal"
  week: 2
  tags: [workflow]
  def: |
    A text interface to your computer's operating system, where you type commands such as `ls` (list files), `cd` (change directory, `cd ..` for one folder up) and `clear`.
    It is not the [console](#gl-console): the terminal runs system commands such as `quarto render`, and the console runs R.

- term: "Console"
  week: 2
  tags: [r, workflow]
  def: |
    The interactive R session in Positron, where code runs line by line and prints its result straight away.
    Use it to try things out and for one-off commands such as `install.packages()`, and keep everything that belongs to the analysis in the document.
  see: [gl-fresh-r-session]

- term: "Working directory"
  week: 2
  tags: [r, workflow]
  def: |
    The folder the [terminal](#gl-terminal) or R currently treats as "here" when it resolves a relative path.
    It changes depending on how code is run, which is why paths in this course are built from the [project root](#gl-project-root) instead.

- term: "Source Control pane"
  week: 2
  tags: [git, workflow]
  def: |
    The view in Positron's Activity Bar that shows your changed files and lets you [stage](#gl-stage) and [commit](#gl-commit) them with a few clicks.
    It is Positron's built-in interface to [Git](#gl-git), so everything it does can also be done with Git commands in the terminal.
  docs:
    url: "https://positron.posit.co/git.html"
    label: "Positron: Git"

- term: "Literate programming"
  week: 2
  tags: [workflow, quarto]
  def: |
    Writing code, the prose that explains it and its results in a single document, so the reasoning and the computation cannot drift apart.
    [Quarto](#gl-quarto) is the tool we use for it.

- term: "Reproducible research"
  week: 2
  tags: [workflow]
  def: |
    Research whose results can be regenerated from the raw data and the code alone, by someone else, on another machine.
    The practical test is whether one [render](#gl-render) rebuilds every number and figure in the output.

- term: "Quarto"
  week: 2
  tags: [quarto]
  def: |
    An open-source scientific and technical publishing system that turns a `.qmd` file of [Markdown](#gl-markdown) and executable [code cells](#gl-code-cell) into HTML, PDF, Word, slides and more.
    Everything in this course, including this page, is a Quarto document.
  docs:
    url: "https://quarto.org/docs/get-started/hello/positron.html"
    label: "Quarto: Hello, Quarto (Positron)"

- term: "Markdown"
  week: 2
  tags: [quarto]
  def: |
    The plain-text formatting syntax used in the body of a `.qmd`: `*italics*`, `**bold**`, `#` for headings, `>` for a block quote, `-` for a list item, `[text](url)` for a link and `|` pipes for a table.
    Quarto uses [Pandoc](#gl-pandoc)'s flavour of Markdown, which stays readable as source and still renders to a formatted document.
  docs:
    url: "https://quarto.org/docs/authoring/markdown-basics.html"
    label: "Quarto: Markdown basics"

- term: "YAML header"
  week: 2
  tags: [quarto]
  def: |
    The block between two `---` lines at the top of a `.qmd`, written in YAML, that holds the document's metadata: title, author, date, [output format](#gl-output-format) and other options.
    Everything below it is the document body, the actual content.
  docs:
    url: "https://quarto.org/docs/get-started/hello/rstudio.html#yaml-header"
    label: "Quarto: YAML header"

- term: "Table of contents"
  week: 2
  tags: [quarto]
  def: |
    An automatically generated list of the document's sections, switched on with `toc: true` in the [YAML header](#gl-yaml-header).
    It is built from the headings, so it stays correct as sections are added or moved.
  docs:
    url: "https://quarto.org/docs/output-formats/html-basics.html#table-of-contents"
    label: "Quarto: table of contents"

- term: "Render"
  week: 2
  tags: [quarto, workflow]
  def: |
    Quarto's term for taking a source `.qmd`, running its code cells and producing a new output document, from the Preview button in Positron or with `quarto render` in the terminal.
    A submission that does not render is not a submission, because nobody else can reproduce it.
  see: [gl-fresh-r-session, gl-render-layers]
  docs:
    url: "https://quarto.org/docs/get-started/hello/positron.html#rendering"
    label: "Quarto: rendering"

- term: "Output format"
  week: 2
  tags: [quarto]
  def: |
    The kind of document a [render](#gl-render) produces, such as HTML, PDF or Word, set with `format:` in the [YAML header](#gl-yaml-header).
    The source stays the same whatever the format: one source, several outputs.
  docs:
    url: "https://quarto.org/docs/output-formats/all-formats.html"
    label: "Quarto: all formats"

- term: "Label"
  week: 2
  tags: [quarto]
  def: |
    A unique name given to a figure, table, section or code cell, such as `#fig-map`, `#tbl-results` or `#sec-intro`, whose prefix says what kind of thing it is.
    A label is what a [cross-reference](#gl-cross-reference) points to.

- term: "Caption"
  week: 2
  tags: [quarto]
  def: |
    The descriptive text attached to a figure or a table, written in the Markdown or set with the `fig-cap` and `tbl-cap` [cell options](#gl-cell-option).
    A good caption lets a reader understand the figure or table without the surrounding text.
  docs:
    url: "https://quarto.org/docs/authoring/figures.html"
    label: "Quarto: figures"

- term: "Cross-reference"
  week: 2
  tags: [quarto]
  def: |
    A numbered, clickable reference from the text to a [labelled](#gl-label) figure, table, equation or section, written as `@fig-example`.
    A label survives reordering, and a phrase such as "the figure below" does not.
  docs:
    url: "https://quarto.org/docs/authoring/cross-references.html"
    label: "Quarto: cross-references"

- term: "Code cell"
  week: 2
  tags: [quarto, r]
  def: |
    A block of executable code inside a `.qmd`, also called a code chunk, which starts with three backticks and `{r}` and ends with three backticks.
    Quarto runs it on [render](#gl-render) and places the result directly underneath, and every cell in this course carries a [label](#gl-label).
  see: [gl-cell-option, gl-inline-code]
  docs:
    url: "https://quarto.org/docs/get-started/computations/positron.html"
    label: "Quarto: computations"

- term: "Version control"
  week: 2
  tags: [git]
  def: |
    A system that records changes to a file or set of files over time, so that you can recall specific versions later.
    [Git](#gl-git) is the version control system this course uses.
  docs:
    url: "https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control"
    label: "Pro Git: about version control"

- term: "Git"
  week: 2
  tags: [git]
  def: |
    A free and open-source distributed [version control](#gl-version-control) system that records the history of a project as a series of [commits](#gl-commit).
    It answers what changed, when, and why, and it lets you go back.
  docs:
    url: "https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F"
    label: "Pro Git: what is Git?"

- term: "Repository"
  week: 2
  tags: [git]
  def: |
    A project under version control: its files together with the full history of every change, usually shortened to "repo".
    You get one either by initialising a folder as a new repository, which is what `git init` and Positron's Source Control pane do, or by [cloning](#gl-clone) an existing one.
  see: [gl-local-repository, gl-remote]
  docs:
    url: "https://git-scm.com/book/en/v2/Git-Basics-Getting-a-Git-Repository"
    label: "Pro Git: getting a Git repository"

- term: "Local repository"
  week: 2
  tags: [git]
  def: |
    The copy of a repository on your own computer, where you edit files and make commits.
    Your commits live only here until you [push](#gl-push-and-pull) them to the [remote](#gl-remote).

- term: "Diff"
  week: 2
  tags: [git]
  def: |
    A comparison of two versions of a file, showing what was removed, what was added and where.
    Reading the diff before you commit is how you check that a commit contains what you think it does.
  docs:
    url: "https://git-scm.com/docs/git-diff"
    label: "Git: git diff"

- term: "Stage"
  week: 2
  tags: [git]
  def: |
    Marking changes to go into the next [commit](#gl-commit), with `git add` or the plus button in the [Source Control pane](#gl-source-control-pane).
    Staging lets you commit some changes and keep others back, so each commit stays one meaningful step.
  docs:
    url: "https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository"
    label: "Pro Git: recording changes"

- term: "Commit"
  week: 2
  tags: [git]
  def: |
    One recorded snapshot of the project: the [staged](#gl-stage) changes, who made them, when, and a [message](#gl-commit-message) saying what changed.
    A commit is the unit of history, so it should be a meaningful checkpoint.
  see: [gl-commit-history]
  docs:
    url: "https://git-scm.com/docs/git-commit"
    label: "Git: git commit"

- term: "Commit message"
  week: 2
  tags: [git, workflow]
  def: |
    The short text attached to a commit, written for a future reader, most importantly future you.
    "Add figure and cross-reference to introduction" helps, "Update" does not, and it is also where AI assistance gets declared.

- term: "Commit history"
  week: 2
  tags: [git]
  def: |
    The list of all commits in a repository, newest first, each with its message, author and date, shown by `git log` or in Positron's Source Control view.
    It is the record of how the project developed, and the way back to any earlier version.
  docs:
    url: "https://git-scm.com/book/en/v2/Git-Basics-Viewing-the-Commit-History"
    label: "Pro Git: viewing the commit history"

- term: "One sentence per line"
  week: 2
  tags: [quarto, git]
  def: |
    Writing prose in a `.qmd` with each sentence on its own source line.
    The rendered document looks the same, but the [diff](#gl-diff) can now show a change sentence by sentence.

- term: "Remote"
  week: 2
  tags: [git]
  def: |
    A version of your repository hosted on the internet, normally on [GitHub](#gl-github), that you push to and pull from.
    The remote is what makes the work shared rather than local.
  docs:
    url: "https://git-scm.com/book/en/v2/Git-Basics-Working-with-Remotes"
    label: "Pro Git: working with remotes"

- term: "Push and pull"
  week: 2
  tags: [git]
  def: |
    Sending your local commits to the [remote](#gl-remote) (push), and bringing commits from it into your [local repository](#gl-local-repository) (pull).
    The Sync button in Positron does both.
  docs:
    url: "https://git-scm.com/docs/git-push"
    label: "Git: git push"

- term: "Clone"
  week: 2
  tags: [git]
  def: |
    Making a local copy of a [remote](#gl-remote) repository, including its full history.
    It is how a homework repository gets from GitHub onto your computer.
  docs:
    url: "https://git-scm.com/docs/git-clone"
    label: "Git: git clone"

- term: "GitHub"
  week: 2
  tags: [git]
  def: |
    A cloud-based platform where you can store, share and work together with others on [Git](#gl-git) repositories.
    Git is the version control system on your computer, and GitHub is the service that hosts the [remote](#gl-remote) copy, which is how homework is distributed and submitted in this course.
  docs:
    url: "https://docs.github.com/en/get-started/start-your-journey/about-github-and-git"
    label: "GitHub Docs: about GitHub and Git"

- term: "Template repository"
  week: 2
  tags: [git]
  def: |
    A repository GitHub can copy into a new repository with the same files and folders but none of the history.
    Every homework starter is distributed this way, which is why your submission repo is yours alone.
  docs:
    url: "https://docs.github.com/en/repositories/creating-and-managing-repositories/creating-a-repository-from-a-template"
    label: "GitHub Docs: creating a repository from a template"

- term: "Sample solution"
  week: 2
  tags: [workflow]
  def: |
    A complete worked answer to a homework, published for everyone after the due date.
    Comparing it with your own submission is the default way to get feedback in this course.

- term: "Opt-in AI feedback"
  week: 2
  tags: [workflow]
  def: |
    The only individual feedback on homework: if your submission repo contains an [open-source licence](#gl-open-source-licence) as `license.md`, an AI compares your work with the [sample solution](#gl-sample-solution) and adds a `FEEDBACK.pdf` to your repo.
    Without that file your submission is not processed at all.

- term: "Open-source licence"
  week: 2
  tags: [workflow, git]
  def: |
    A licence that allows anyone to use, copy, change and share a piece of work under stated conditions, such as keeping the copyright notice, the MIT License being a short and common example.
    Adding it as `license.md` to a homework repo is how you opt in to [AI feedback](#gl-opt-in-ai-feedback).
  docs:
    url: "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/licensing-a-repository"
    label: "GitHub Docs: licensing a repository"

# --- Week 3: R fundamentals --------------------------------------------------

- term: "Object"
  week: 3
  tags: [r]
  def: |
    A named container holding information, with a name, a value and a [type](#gl-data-type).
    In R, everything that exists is an object, including [functions](#gl-function-and-argument) and fitted models.
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-lang.html#Objects"
    label: "R Language Definition: objects"

- term: "Assignment"
  week: 3
  tags: [r]
  def: |
    Storing a value in an [object](#gl-object) under a name with `<-`, read aloud as "gets": `country <- "Germany"`.
    Assigning to a name that already exists overwrites it without asking.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/assignOps.html"
    label: "R documentation: assignment operators"

- term: "Case sensitivity"
  week: 3
  tags: [r]
  def: |
    R treats upper and lower case as different, so `city` and `City` are two different names and `Mean()` is not `mean()`.
    A wrong capital letter is the most common cause of an "object not found" [error](#gl-error-and-warning).

- term: "Function and argument"
  week: 3
  tags: [r]
  def: |
    A function is a named, reusable piece of code that takes inputs, its arguments, and returns an output, called as `name(argument1, argument2)`.
    Arguments can be given by position or by name, and naming them makes code readable a month later.
  see: [gl-default-argument-value, gl-writing-a-function, gl-help-page]
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-intro.html#Named-arguments-and-defaults"
    label: "An Introduction to R: named arguments and defaults"

- term: "Default argument value"
  week: 3
  tags: [r]
  def: |
    The value an argument takes when the call does not supply one, set in the function definition, as `digits = 0` is for `round()`.
    It is why many functions work with a single argument, and the Usage section of a [help page](#gl-help-page) lists every default.

- term: "Writing a function"
  week: 3
  tags: [r]
  def: |
    Creating your own function with `function()` and assigning it to a name like any object: `double_it <- function(x) { x * 2 }`.
    The arguments go between the parentheses, the body between the braces, and the value of the last line of the body is the output.
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-intro.html#Writing-your-own-functions"
    label: "An Introduction to R: writing your own functions"

- term: "Nested function call"
  week: 3
  tags: [r]
  def: |
    A function call inside another, such as `round(mean(x), digits = 1)`, which R evaluates from the inside out.
    Deep nesting is hard to read, which is what the [native pipe](#gl-native-pipe) is for.

- term: "Native pipe"
  week: 3
  tags: [r]
  def: |
    The `|>` operator, which passes the value on its left into the function call on its right as the first argument, so a sequence of steps reads left to right, as "and then".
    This course uses `|>` throughout and not the older `%>%` from the magrittr package.
  see: [gl-pipeline]
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/pipeOp.html"
    label: "R documentation: forward pipe operator"

- term: "Comment"
  week: 3
  tags: [r]
  def: |
    Text after a `#` on a line of code, which R ignores when it runs the code.
    In a Quarto document the prose carries the reasoning, so comments stay short and say why a line is there.
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-lang.html#Comments"
    label: "R Language Definition: comments"

- term: "Help page"
  week: 3
  tags: [r]
  def: |
    The documentation every R function has, opened with `?mean` or `help(mean)`.
    Its sections say what the function does, which arguments it takes and their defaults (Usage and Arguments) and what it returns (Value), and the Examples at the bottom are usually the fastest way in.
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-intro.html#Getting-help-with-functions-and-features"
    label: "An Introduction to R: getting help"

- term: "Error and warning"
  week: 3
  tags: [r]
  def: |
    An error stops the code and nothing is computed, while a warning lets the code finish but flags something suspicious.
    Read an error in two parts, where it broke and what went wrong, before you change anything.
  see: [gl-render-layers]

- term: "Data type"
  week: 3
  tags: [r, data]
  def: |
    What kind of information a value is: `double`, `integer`, `character` or `logical`, plus `factor` and `Date` built on top of them.
    `class()` tells you which one you have.
  see: [gl-double-and-integer, gl-character, gl-logical, gl-factor, gl-date, gl-column-type]
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-lang.html#Basic-types"
    label: "R Language Definition: basic types"

- term: "Double and integer"
  week: 3
  tags: [r, data]
  def: |
    R's two numeric types: `double` for decimal numbers, the default, and `integer` for whole numbers, written with an `L` as in `42L`.
    The difference rarely matters here, but whether a value is numeric at all does, and `is.numeric()` answers that.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/numeric.html"
    label: "R documentation: numeric vectors"

- term: "Character"
  week: 3
  tags: [r, data]
  def: |
    R's type for text, also called a string, always written in quotes: `"Germany"`.
    A number in quotes is text, so `"42" + 1` is an error until it is [converted](#gl-type-conversion).
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/character.html"
    label: "R documentation: character vectors"

- term: "Logical"
  week: 3
  tags: [r, data]
  def: |
    R's type for true or false, `TRUE` and `FALSE`, which every [comparison](#gl-comparison-and-logical-operators) returns.
    Logicals are the backbone of filtering, and the sum of a logical vector counts its `TRUE` values.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/logical.html"
    label: "R documentation: logical vectors"

- term: "Comparison and logical operators"
  week: 3
  tags: [r]
  def: |
    Operators that return `TRUE` or `FALSE`: `<`, `>`, `==`, `!=`, `%in%`, combined with `&` (and), `|` (or) and `!` (not).
    Note that `=` assigns and `==` compares.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/Comparison.html"
    label: "R documentation: relational operators"

- term: "Factor"
  week: 3
  tags: [r, data]
  def: |
    R's type for categories, a vector encoded with a fixed set of levels, such as autocracy, hybrid and democracy.
    Stored this way, categories can be ordered and counted, and the order of the levels controls how they appear in tables and plots.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/factor.html"
    label: "R documentation: factors"

- term: "Date"
  week: 3
  tags: [r, data]
  def: |
    R's type for calendar dates, created from text in the form year-month-day, as in `as.Date("1957-03-25")`.
    A date knows about the calendar, so dates can be sorted and subtracted.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/Dates.html"
    label: "R documentation: dates"

- term: "`NA`"
  week: 3
  tags: [r, data]
  def: |
    R's marker for a missing value, "not available".
    It appears when a value was never recorded, when a [conversion](#gl-type-conversion) fails and when a [join](#gl-join) finds no match, so always check how many you have.
  see: [gl-missing-values-in-calculations]
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/NA.html"
    label: "R documentation: NA"

- term: "`NaN`"
  week: 3
  tags: [r, data]
  def: |
    R's value for "not a number", the result of a calculation with no defined answer, such as `0 / 0` or `sqrt(-1)`.
    It usually comes with a [warning](#gl-error-and-warning), and R also counts it as a missing value.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/is.finite.html"
    label: "R documentation: finite, infinite and NaN numbers"

- term: "Type conversion"
  week: 3
  tags: [r, data]
  def: |
    Deliberately changing a value from one [type](#gl-data-type) to another with an `as.` function, such as `as.numeric("42")` or `as.character(2026)`.
    A value that cannot be converted, such as `as.numeric("five")`, becomes [`NA`](#gl-na) with a warning.

- term: "Coercion"
  week: 3
  tags: [r, data]
  def: |
    R changing values from one [type](#gl-data-type) to another automatically, most often when a vector mixes types, without anyone asking for it.
    `c(1, 2, "three")` becomes all text and `c(1, TRUE, FALSE)` becomes the numbers 1, 1 and 0, whereas [type conversion](#gl-type-conversion) is the same change made on purpose.

- term: "Data structure"
  week: 3
  tags: [r, data]
  def: |
    How R organises values: from a single value, through vectors, matrices and arrays, to data frames and lists.
    Each step adds a dimension or, for data frames and lists, the freedom to mix types.
  see: [gl-scalar, gl-vector, gl-matrix, gl-array-and-tensor, gl-data-frame-and-tibble, gl-list]

- term: "Scalar"
  week: 3
  tags: [r, data]
  def: |
    A single value, written in italic lowercase as $x$ in this course.
    R has no scalars: a single value is a [vector](#gl-vector) of length 1, so everything that works on a vector works on one value too.

- term: "Vector"
  week: 3
  tags: [r, data]
  def: |
    An ordered set of values of one type, created with `c()` and written in bold lowercase as $\mathbf{x}$.
    It is the building block of R, and arithmetic on a vector works on every element at once.
  see: [gl-vectorisation, gl-coercion]
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/vector.html"
    label: "R documentation: vectors"

- term: "Vectorisation"
  week: 3
  tags: [r]
  def: |
    Applying an operation to every element of a [vector](#gl-vector) at once, without writing a loop: `c(84, 68) * 1000000` multiplies both values.
    Most R operators and functions are vectorised, which is why a function written for one value usually works on a whole column too.
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-intro.html#Vector-arithmetic"
    label: "An Introduction to R: vector arithmetic"

- term: "Matrix"
  week: 3
  tags: [r, data]
  def: |
    A two-dimensional arrangement of values of one type, in rows and columns, created with `matrix()` and written in bold uppercase as $\mathbf{X}$.
    It is the workhorse of linear algebra, and of every regression under the hood.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/matrix.html"
    label: "R documentation: matrices"

- term: "Array and tensor"
  week: 3
  tags: [r, data]
  def: |
    The generalisation of a matrix to three or more dimensions, created in R with `array()`.
    In mathematics it is called a tensor and written in calligraphic as $\mathcal{X}$, and this course rarely needs one.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/array.html"
    label: "R documentation: arrays"

- term: "Data frame and tibble"
  week: 3
  tags: [data, r]
  def: |
    R's structure for a rectangular dataset: a table in which each column is a [vector](#gl-vector) with its own type, so one dataset can mix numbers, text and logicals.
    A tibble is the tidyverse's modern reimagining of the data frame, with friendlier printing and fewer surprises.
  see: [gl-tidy-data, gl-column-type]
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/data.frame.html"
    label: "R documentation: data frames"

- term: "List"
  week: 3
  tags: [r, data]
  def: |
    R's flexible container, created with `list()`, which can hold anything, including other lists.
    You will rarely build one yourself, but every fitted model in this course comes back as one.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/list.html"
    label: "R documentation: lists"

- term: "Observation"
  week: 3
  tags: [data]
  def: |
    One unit of what was measured, such as one country in one year.
    In [tidy data](#gl-tidy-data) each observation has its own row.

- term: "Variable"
  week: 3
  tags: [data]
  def: |
    One characteristic measured across observations, such as population or regime type.
    In [tidy data](#gl-tidy-data) each variable has its own column.

- term: "Indexing"
  week: 3
  tags: [r, data]
  def: |
    Picking values out of a structure: `[ ]` by position or by condition, and `$` by name, for data frames and lists.
    On a data frame `[row, column]` takes both (a blank means all), a negative position drops instead of keeps, and a [logical](#gl-logical) vector keeps the elements where it is `TRUE`, which is filtering.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/Extract.html"
    label: "R documentation: extract or replace parts of an object"

- term: "Missing values in calculations"
  week: 3
  tags: [r, data]
  def: |
    Most summary functions, such as `mean()` or `sum()`, return [`NA`](#gl-na) if any value is missing, because the true answer is then unknown.
    Their argument `na.rm = TRUE` removes the missing values first, which is a decision about your data worth stating in the text.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/mean.html"
    label: "R documentation: mean"

- term: "Package"
  week: 3
  tags: [r]
  def: |
    A bundle of R functions, their documentation and sometimes data, that someone wrote and shared, whose contents become available only once it is loaded.
    Install it once with `install.packages()` in the [console](#gl-console), and load it every session with `library()` at the top of the document.
  see: [gl-cran, gl-namespace]
  docs:
    url: "https://cran.r-project.org/doc/manuals/r-release/R-intro.html#Packages"
    label: "An Introduction to R: packages"

- term: "Variables pane"
  week: 3
  tags: [r, workflow]
  def: |
    The Positron pane that lists every object in your current R session, with its type and a preview of its value.
    It shows what exists in the [console](#gl-console), which can differ from what exists in a [fresh R session](#gl-fresh-r-session).
  docs:
    url: "https://positron.posit.co/variables-pane.html"
    label: "Positron: Variables pane"

- term: "Cell option"
  week: 3
  tags: [quarto]
  def: |
    A `#|` line at the top of a [code cell](#gl-code-cell) that controls it, such as `label:`, `echo: false` (hide the code), `eval: false` (do not run it), `include: false` (show nothing) or `error: true` (show the error and keep rendering).
    Set under `execute:` in the [YAML header](#gl-yaml-header), an option applies to every cell instead.
  docs:
    url: "https://quarto.org/docs/computations/execution-options.html"
    label: "Quarto: execution options"

- term: "Inline code"
  week: 3
  tags: [quarto, r]
  def: |
    R code inside a sentence, written as a backtick, the letter `r`, a space, the code and a closing backtick, whose result replaces it in the rendered text.
    A number reported this way updates itself when the data or the code changes.
  docs:
    url: "https://quarto.org/docs/computations/inline-code.html"
    label: "Quarto: inline code"

- term: "Fresh R session"
  week: 3
  tags: [r, quarto]
  def: |
    An R session with nothing in it yet, which is what Quarto starts for every [render](#gl-render) before running every cell from top to bottom.
    An object you created only in the [console](#gl-console) does not exist there, which is the usual reason a render fails with "object not found" while the console works.

# --- Week 4: The tidyverse ---------------------------------------------------

- term: "Eight-step workflow"
  week: 4
  tags: [workflow]
  def: |
    The fixed sequence every analysis in this course follows, from stating the [estimand](#gl-estimand) to reflecting on limitations.
    It is also the shape of the take-home exam, and each week deepens one or two of its steps, starting with the [data summary](#gl-data-summary).

- term: "Data summary"
  week: 4
  tags: [workflow, data]
  def: |
    Step 2 of the [eight-step workflow](#gl-eight-step-workflow): describing the data an analysis uses, its variables, measurement, coverage and obvious issues, before any model.
    In practice it is a [pipeline](#gl-pipeline) ending in a captioned table, and every decision that changes the data, such as dropping missing values, is named in the text.

- term: "Render layers"
  week: 4
  tags: [quarto]
  def: |
    The programs a PDF [render](#gl-render) passes through in turn: R runs the code cells, [Pandoc](#gl-pandoc) converts the Markdown, and [LaTeX](#gl-latex) typesets the PDF.
    An error message shows which layer failed, and only the first error counts, so fix that one and render again.

- term: "Pandoc"
  week: 4
  tags: [quarto]
  def: |
    A universal document converter, which Quarto runs after the code cells have executed to turn [Markdown](#gl-markdown) into HTML, Word or LaTeX.
    An error from the [YAML header](#gl-yaml-header) surfaces at this layer, with a line and column number.
  docs:
    url: "https://pandoc.org/"
    label: "Pandoc"

- term: "LaTeX"
  week: 4
  tags: [quarto]
  def: |
    A high-quality typesetting system, the last layer of a PDF render, which turns the converted document into the PDF.
    Its errors usually come from a special character in your prose, such as `%`, `&`, `$` or a stray backslash.
  docs:
    url: "https://www.latex-project.org/"
    label: "The LaTeX Project"

- term: "Base R"
  week: 4
  tags: [r]
  def: |
    The functions R ships with before any package is installed, such as `mean()`, `round()` and `data.frame()`.
    Everything in week 3 was base R.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/00Index.html"
    label: "R documentation: the base package"

- term: "CRAN"
  week: 4
  tags: [r]
  def: |
    The Comprehensive R Archive Network, a network of servers around the world that store identical, up-to-date versions of R and of more than 20,000 contributed [packages](#gl-package).
    `install.packages()` downloads from it.
  docs:
    url: "https://cran.r-project.org/"
    label: "CRAN"

- term: "Namespace (`::`)"
  id: gl-namespace
  week: 4
  tags: [r]
  def: |
    Calling a function by naming the [package](#gl-package) it lives in, written `package::function()`, as in `readxl::read_excel()`.
    It makes the source clear, needs no `library()` for a one-off call, and settles which function you mean when two packages share a name.
  see: [gl-masking]
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/ns-dblcolon.html"
    label: "R documentation: double colon"

- term: "Masking"
  week: 4
  tags: [r]
  def: |
    What happens when a loaded package has a function with the same name as one already available, so the newer one wins.
    `library(tidyverse)` reports, for example, that `dplyr::filter()` masks `stats::filter()`, and the [namespace](#gl-namespace) operator `::` picks one explicitly.

- term: "Tidyverse"
  week: 4
  tags: [r, data]
  def: |
    An opinionated collection of R packages designed for data science, which share an underlying design philosophy, grammar and data structures.
    `library(tidyverse)` loads the core packages, among them readr for reading files, tidyr for [reshaping](#gl-reshaping), dplyr for transforming with [verbs](#gl-verb) and ggplot2 for plots.
  see: [gl-tidy-data, gl-data-cycle]
  docs:
    url: "https://www.tidyverse.org/packages/"
    label: "tidyverse: packages"

- term: "Data cycle"
  week: 4
  tags: [workflow, data]
  def: |
    The stages of a data analysis: import the data, tidy it, transform it, visualise it, model it, and communicate the result.
    In a real project the middle stages loop, because a plot or a model often sends you back to tidy or transform again.
  docs:
    url: "https://r4ds.hadley.nz/intro.html"
    label: "R for Data Science: introduction"

- term: "Tidy data"
  week: 4
  tags: [data]
  def: |
    Data in which every column is a [variable](#gl-variable), every row is an [observation](#gl-observation), and every cell holds a single value.
    Most tools assume this shape, and most of the work of an analysis is getting data into it.
  see: [gl-wide-and-long-format, gl-reshaping]
  docs:
    url: "https://tidyr.tidyverse.org/articles/tidy-data.html"
    label: "tidyr: tidy data"

- term: "Wide and long format"
  week: 4
  tags: [data]
  def: |
    Wide data spreads one variable across several columns, for example one column per year, and long data stacks it into one column with a second column saying which year.
    Going from one to the other is [reshaping](#gl-reshaping).

- term: "Reshaping"
  week: 4
  tags: [data, r]
  def: |
    Changing the layout of a table without changing its information, in the tidyverse by pivoting: `pivot_longer()` turns column names into values of a new variable, and `pivot_wider()` turns values back into column names.
    Keep working data long and [tidy](#gl-tidy-data), and pivot wider only for a table meant for a reader.
  docs:
    url: "https://tidyr.tidyverse.org/articles/pivot.html"
    label: "tidyr: pivoting"

- term: "Project root"
  week: 4
  tags: [workflow, r]
  def: |
    The top folder of a project, the fixed point every other path is expressed relative to.
    The `here` package builds every path from it, as in `here("data", "file.csv")`, which is what makes a project run on a machine other than yours.
  docs:
    url: "https://here.r-lib.org/"
    label: "here package"

- term: "File extension"
  week: 4
  tags: [data]
  def: |
    The ending of a file name, such as `.csv`, `.xlsx`, `.dta` or `.qmd`, which tells you and your software what format the file is in.
    Each data format has its own reading function, so the extension tells you which one to reach for.
  docs:
    url: "https://r4ds.hadley.nz/data-import.html"
    label: "R for Data Science: data import"

- term: "CSV"
  week: 4
  tags: [data]
  def: |
    Comma-separated values: a plain-text file with one row per line and the columns separated by commas, which any program can read.
    Files saved by a German-language Excel often separate columns with semicolons instead, and readr reads those with `read_csv2()`.
  docs:
    url: "https://readr.tidyverse.org/"
    label: "readr"

- term: "Excel workbook and sheet"
  week: 4
  tags: [data]
  def: |
    An Excel file (`.xlsx` or `.xls`) is a workbook that can hold several sheets, each its own table.
    The readxl package, installed with the tidyverse but not loaded by it, lists the sheets and reads one at a time.
  docs:
    url: "https://readxl.tidyverse.org/"
    label: "readxl"

- term: "Column type"
  week: 4
  tags: [r, data]
  def: |
    The [data type](#gl-data-type) of a column, shown in short form when a tibble is printed: `<chr>` character, `<dbl>` double, `<int>` integer, `<lgl>` logical, `<fct>` factor and `<date>` date.
    Check it first with new data, because a number or a date read in as text breaks everything that follows.
  docs:
    url: "https://tibble.tidyverse.org/articles/types.html"
    label: "tibble: column types"

- term: "Scientific notation"
  week: 4
  tags: [r]
  def: |
    Writing a very large or very small number as a number times a power of ten, where `e` means "times ten to the": `1e6` is a million and `2.5e-3` is 0.0025.
    R prints large numbers this way too, so `8.4e+07` is 84 million.
  docs:
    url: "https://search.r-project.org/R/refmans/base/html/NumericConstants.html"
    label: "R documentation: numeric constants"

- term: "Verb"
  week: 4
  tags: [r, data]
  def: |
    A tidyverse function named for what it does to a table, such as dplyr's `filter()` (keep rows), `select()` (keep columns), `mutate()` (create or change columns) and `arrange()` (sort rows).
    Every verb takes a table first, names columns without quotes, and returns a new table, so verbs chain into a [pipeline](#gl-pipeline).
  docs:
    url: "https://dplyr.tidyverse.org/articles/dplyr.html"
    label: "dplyr: introduction"

- term: "Join"
  week: 4
  tags: [data]
  def: |
    Combining two tables by matching rows on a shared [key](#gl-key), so the result has the columns of both.
    The four joins differ only in which rows survive when a key has no partner: a left join keeps every row of the first table, a right join every row of the second, an inner join only the matches, and a full join everything.
  docs:
    url: "https://dplyr.tidyverse.org/reference/mutate-joins.html"
    label: "dplyr: mutating joins"

- term: "Key"
  week: 4
  tags: [data]
  def: |
    The column, or columns, a [join](#gl-join) matches rows on, such as `country`, and when it has a different name in each table, `join_by()` says which columns belong together.
    A key matches text exactly, so one spelling difference silently produces [`NA`](#gl-na): count the missing values after every join.
  docs:
    url: "https://dplyr.tidyverse.org/reference/join_by.html"
    label: "dplyr: join specifications"

- term: "Grouped summary"
  week: 4
  tags: [data, r]
  def: |
    Reducing a table to summary statistics, such as a count or a mean, once for each group defined by the values of one or more columns.
    In dplyr, `group_by()` sets the groups without changing anything you can see, `summarise()` then returns one row per group, and `count()` is the shortcut for the number of rows per group.
  docs:
    url: "https://dplyr.tidyverse.org/articles/grouping.html"
    label: "dplyr: grouped data"

- term: "Median"
  week: 4
  tags: [probability, data]
  def: |
    The middle value of a set of numbers once they are sorted, so half the values lie below it and half above.
    Unlike the [mean](#gl-mean-and-standard-deviation), it barely moves when a few values are extreme, which makes it the better summary of skewed data such as income.

- term: "Pipeline"
  week: 4
  tags: [r, workflow]
  def: |
    A sequence of steps chained with the [native pipe](#gl-native-pipe), each taking the previous result, from reading a file to a finished table.
    Pipelines are powerful, so build them one step at a time and check the result at every step.
  docs:
    url: "https://r4ds.hadley.nz/data-transform.html"
    label: "R for Data Science: data transformation"

- term: "Codebook"
  week: 4
  tags: [data]
  def: |
    The documentation of a dataset, listing every variable with what it measures, its scale or categories, and how missing values are coded.
    Read it before analysing, because column names rarely say enough.

# --- Week 5: Data visualisation ----------------------------------------------

- term: "Grammar of graphics"
  week: 5
  tags: [data, r]
  def: |
    The idea that every statistical figure is built from the same few parts: data, [aesthetic mappings](#gl-aesthetic-mapping), [geoms](#gl-geom), [scales](#gl-scale), facets, labels and a [theme](#gl-theme) [@wilkinson2005grammar; @wickham2010layered].
    `ggplot2` implements it, so a plot starts with `ggplot()` and grows one [layer](#gl-layer) at a time with `+`.
  docs:
    url: "https://ggplot2.tidyverse.org/"
    label: "ggplot2"

- term: "Aesthetic mapping"
  week: 5
  tags: [data, r]
  def: |
    The link between a variable and a visual property of a plot, such as position, colour, size or shape, written inside `aes()`.
    Inside `aes()` a property follows the data, outside it is one fixed value for every mark.
  docs:
    url: "https://ggplot2.tidyverse.org/reference/aes.html"
    label: "ggplot2: aesthetic mappings"

- term: "Geom"
  week: 5
  tags: [data, r]
  def: |
    The kind of mark that represents the data in a plot, such as points, lines, bars or boxes, added as a `geom_*()` layer.
    Several geoms can be stacked on the same [aesthetic mappings](#gl-aesthetic-mapping), for example points with a line through them.
  docs:
    url: "https://ggplot2.tidyverse.org/reference/index.html#layers"
    label: "ggplot2: layers"

- term: "Scale"
  week: 5
  tags: [data, r]
  def: |
    The rule that turns data values into visual values: positions on an axis, colours, sizes, and the breaks and labels of axes and legends.
    A log scale, for example, gives equal space to every multiplication of a value, which suits skewed variables such as income.
  docs:
    url: "https://ggplot2.tidyverse.org/reference/index.html#scales"
    label: "ggplot2: scales"

- term: "Histogram"
  week: 5
  tags: [data, probability]
  def: |
    A chart of one numeric variable that cuts its range into bins and draws a bar for the number of observations in each.
    The bin width is a choice that changes what the shape seems to say, so try several, and compare it with a smooth [density](#gl-probability-density) curve.
  see: [gl-density-plot, gl-skewed-distribution]

- term: "Box plot"
  week: 5
  tags: [data]
  def: |
    A compact summary of a numeric variable, often one box per group: the line marks the [median](#gl-median), the box holds the middle half of the observations, and whiskers and points show the rest.
    With few observations, draw the points themselves on top, because a box hides how many there are.
  see: [gl-violin-plot, gl-jitter]

- term: "Overplotting"
  week: 5
  tags: [data]
  def: |
    Marks drawn on top of each other, so a plot hides how many observations sit in one place.
    Transparency, small points, jitter or [small multiples](#gl-small-multiples) make the hidden density visible again.

- term: "Small multiples"
  week: 5
  tags: [data, r]
  def: |
    A series of small panels that show the same plot for each group, with the same axes, so the eye can compare them at a glance.
    In `ggplot2` they are made with `facet_wrap()` or `facet_grid()`, and free axes per panel trade cross-panel comparison for detail within a panel.
  docs:
    url: "https://ggplot2.tidyverse.org/reference/facet_wrap.html"
    label: "ggplot2: facet_wrap()"

- term: "Data-ink ratio"
  week: 5
  tags: [data, interpretation]
  def: |
    Edward Tufte's measure of a figure: the share of its ink that shows data rather than decoration [@tufte1983visual].
    Raising it means removing every mark that carries no information, such as heavy grids, backgrounds and redundant legends, and choosing deliberately what stays.
  see: [gl-chartjunk]

- term: "Chartjunk"
  week: 5
  tags: [data, interpretation]
  def: |
    Tufte's word for decoration in a figure that carries no information and distracts from the data: 3D effects, heavy borders, gradients, ornamental grids [@tufte1983visual].
    It lowers the [data-ink ratio](#gl-data-ink-ratio) and often distorts what the reader perceives.
  see: [gl-graphical-perception]

- term: "Colour palette"
  week: 5
  tags: [data]
  def: |
    The set of colours a figure uses for a variable, matched to its kind: qualitative for categories without an order, sequential for values from low to high, diverging for values above and below a meaningful midpoint.
    Avoid letting red against green carry a distinction, and prefer palettes such as viridis that stay distinct for colourblind readers and in greyscale.
  see: [gl-redundant-encoding]
  docs:
    url: "https://ggplot2.tidyverse.org/reference/scale_viridis.html"
    label: "ggplot2: viridis colour scales"

- term: "Redundant encoding"
  week: 5
  tags: [data]
  def: |
    Showing the same variable through two visual properties at once, such as colour and point shape, so that colour is never the only cue.
    It keeps a figure readable for colourblind readers and in a black and white print.

- term: "Layer"
  week: 5
  tags: [r, data]
  def: |
    One component of a `ggplot2` figure, such as a [geom](#gl-geom), a [scale](#gl-scale) or a [theme](#gl-theme), stacked onto the plot with `+`.
    The [native pipe](#gl-native-pipe) only carries the data into `ggplot()`, and every step after that is a layer added with `+`.
  see: [gl-grammar-of-graphics]

- term: "Theme"
  week: 5
  tags: [r, data]
  def: |
    The look of everything in a plot that is not data: background, grid lines, fonts and the position of the legend.
    Pick a complete theme first, such as `theme_classic()`, the course default, then adjust single elements with `theme()`.
  see: [gl-data-ink-ratio]
  docs:
    url: "https://ggplot2.tidyverse.org/reference/ggtheme.html"
    label: "ggplot2: complete themes"

- term: "Log scale"
  week: 5
  tags: [data]
  def: |
    An axis on which equal distances multiply the value instead of adding to it, so the steps from 1,000 to 10,000 and from 10,000 to 100,000 are equally long.
    It spreads out a [right-skewed](#gl-skewed-distribution) variable such as income, where an extra dollar matters more to the poor than to the rich.
  see: [gl-scale]

- term: "Skewed distribution"
  week: 5
  tags: [probability, data]
  def: |
    A distribution with a long tail on one side, such as income: many small values and a few very large ones make it right-skewed.
    In a skewed variable the [mean](#gl-mean-and-standard-deviation) is pulled towards the tail, so the [median](#gl-median) or a [log scale](#gl-log-scale) often describes it better.

- term: "Bar chart"
  week: 5
  tags: [data]
  def: |
    A chart that shows a value per category by the length of a bar, either a count of rows or a value computed beforehand.
    Because length carries the value, bars start at zero, and their order is a decision, set through the levels of a [factor](#gl-factor).
  see: [gl-truncated-axis]

- term: "Scatter plot"
  week: 5
  tags: [data]
  def: |
    A chart of two numeric variables, one point per observation, which shows the direction, shape and strength of their relationship.
    With many points, watch for [overplotting](#gl-overplotting).

- term: "Line plot"
  week: 5
  tags: [data]
  def: |
    A chart that connects points in the order of the x axis, the natural choice for change over time.
    With several units, such as countries, each needs its own line through a grouping variable, and [small multiples](#gl-small-multiples) keep many lines readable.

- term: "Density plot"
  week: 5
  tags: [data, probability]
  def: |
    A smooth curve estimated from the data that shows the shape of a numeric variable, an alternative to the [histogram](#gl-histogram) without bins.
    The area under the curve is 1, so its height is a [probability density](#gl-probability-density), not a count.

- term: "Violin plot"
  week: 5
  tags: [data]
  def: |
    A [density plot](#gl-density-plot) per group, mirrored around its axis, so each group's whole distribution is visible side by side.
    It shows shape, such as two peaks, where a [box plot](#gl-box-plot) shows only five numbers, but with very few observations the smooth shape can mislead.

- term: "Jitter"
  week: 5
  tags: [data, r]
  def: |
    Small random shifts added to the position of points so that points on top of each other become visible, a remedy for [overplotting](#gl-overplotting).
    Because the shifts are random, set a seed with `set.seed()` so the figure looks the same on every render.

- term: "Legend and direct labels"
  week: 5
  tags: [data]
  def: |
    A legend is the key that decodes an [aesthetic mapping](#gl-aesthetic-mapping), such as which colour stands for which continent.
    Direct labels write the name next to the data instead, which spares the reader from looking back and forth.
  see: [gl-annotation]

- term: "Annotation"
  week: 5
  tags: [data, interpretation]
  def: |
    Marks added to a figure that are not rows of the data, such as a text note, a reference line or a label on a single point.
    Annotate the few things the reader should notice, not everything, so the annotation carries information instead of clutter.
  see: [gl-data-ink-ratio]

- term: "Truncated axis"
  week: 5
  tags: [data, interpretation]
  def: |
    An axis that starts well above zero, which exaggerates differences when values are shown as lengths, as in a [bar chart](#gl-bar-chart).
    For points and lines, which show values by position, zooming in on the range of the data is fine.

- term: "Graphical perception"
  week: 5
  tags: [data, interpretation]
  def: |
    How accurately readers decode the visual encodings of a chart: positions on a common axis and lengths best, angles, areas, depth and colour shades worst [@cleveland1984graphical].
    It is the reason pie charts and 3D charts mislead, and why most charts show values by position or length.

- term: "Choropleth"
  week: 5
  tags: [data]
  def: |
    A map that colours each area, such as a country, by the value of a variable.
    The values usually arrive through a [join](#gl-join) by name, so an area without a match shows up empty, which looks like missing data but may be a spelling difference.
  see: [gl-simple-features]

- term: "Simple features"
  week: 5
  tags: [data, r]
  def: |
    The standard way to store geographic shapes as a column of a table, one row per area, so maps work with the same verbs as any other data.
    In R the `sf` package reads them, and `ggplot2` draws them with `geom_sf()`.
  see: [gl-choropleth]
  docs:
    url: "https://r-spatial.github.io/sf/"
    label: "sf: simple features for R"
