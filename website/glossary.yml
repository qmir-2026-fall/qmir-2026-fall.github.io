# -----------------------------------------------------------------------------
# The course glossary, as data. Rendered alphabetically by website/glossary.qmd.
#
# Adding a term:
#   term:  as it should be displayed. Package and function names in backticks.
#          Start with a letter, so the term files under the A to Z jump bar.
#   week:  the week in which students FIRST meet the term, not where it is most
#          advanced. That is the earliest week whose slide text uses it (not folded
#          code, not speaker notes). A term no live deck uses yet takes its planned
#          week from `weeks:` in course.yml. The page derives the block name from
#          `blocks:` in course.yml, so the glossary and the schedule cannot drift
#          apart. glossary.qmd stops the render on a missing or out-of-range week.
#   tags:  one or more from the CLOSED vocabulary below. glossary.qmd stops the
#          render on an unknown tag, so the tag set cannot sprawl the way the slide
#          font sizes did in the previous course iteration.
#          workflow quarto git r data probability model prior mcmc diagnostics
#          regression multilevel interpretation
#   def:   one or two sentences, ONE SENTENCE PER LINE (.claude/writing.md).
#
# .claude/writing.md applies here as everywhere: no em dashes, no en dashes, no semicolons.
# No frequentist framing (.claude/course-design.md). Where a contrast genuinely teaches
# something, as with credible versus confidence intervals, explain the contrast
# rather than substituting one framework for the other.
#
# Order in this file does not matter. The page sorts alphabetically. Entries are
# grouped by week here only so a new deck's terms are easy to check off.
# -----------------------------------------------------------------------------

# --- Week 1: Introduction ----------------------------------------------------

- term: "Estimand"
  week: 1
  tags: [workflow, interpretation]
  def: |
    The quantity you actually want to know, stated precisely, before any model is fitted.
    Naming it first is step 1 of the workflow, and it is what keeps a model answerable to a question.

- term: "Estimator"
  week: 1
  tags: [workflow, model]
  def: |
    The procedure by which we learn about the estimand, our method.
    In this course the estimator is a Bayesian model, and what it returns is a whole posterior distribution.

- term: "Estimate"
  week: 1
  tags: [interpretation]
  def: |
    The result the estimator gives us, what we get.
    Estimand, estimator and estimate are three different things: what we want, how we go about it, and what comes back.

- term: "Inference"
  week: 1
  tags: [probability, interpretation]
  def: |
    Using known information to infer something unknown.
    Measuring two variables to learn about their association, or sampling people to learn about a population, are both inference.

- term: "Signal and noise"
  week: 1
  tags: [probability, interpretation]
  def: |
    Signal is a real pattern in the world, and noise is random variation from measurement or data collection.
    Telling the two apart, and saying how certain we can be about it, is the fundamental task of quantitative methods.

- term: "Association"
  week: 1
  tags: [interpretation]
  def: |
    Two variables moving together, so that knowing one tells you something about the other.
    An association is not a causal effect: this course analyses associations, and identifying causes is the subject of a different course.

- term: "Point estimate"
  week: 1
  tags: [interpretation]
  def: |
    A single number summarising a posterior, such as its mean or median.
    Reported without an interval it is a claim the data cannot support, so this course always gives the width alongside it.

- term: "Eight-step workflow"
  week: 1
  tags: [workflow]
  def: |
    The fixed sequence every analysis in this course follows, from clarifying the estimand to reflecting on limitations.
    It is also the shape of the take-home exam, and every week deepens one or two of its steps.

- term: "Data summary"
  week: 1
  tags: [workflow, data]
  def: |
    Step 2 of the workflow: describing the variables the analysis uses, their scales and how they are distributed, before any model.
    Every decision that changes the data, such as dropping blank answers, is named here.

- term: "Parameter"
  week: 1
  tags: [probability, model]
  def: |
    An unknown quantity in a model that we want to learn about, such as a slope or an average.
    Bayesian inference gives a parameter a distribution rather than one fixed number.

- term: "Probability distribution"
  week: 1
  tags: [probability]
  def: |
    A description of how plausible each possible value of a quantity is.
    Here, distributions describe both data and parameters, which is the central move of the Bayesian approach.

- term: "Probability density"
  week: 1
  tags: [probability]
  def: |
    The height of the curve of a continuous distribution.
    The density itself is not a probability: the area under the curve between two values is.

- term: "Normal distribution"
  week: 1
  tags: [probability]
  def: |
    The symmetric bell-shaped distribution, written $\mathcal{N}(\mu, \sigma)$ in this course.
    It has exactly two knobs, the mean and the standard deviation, and no other shape is available.

- term: "Mean and standard deviation"
  week: 1
  tags: [probability, data]
  def: |
    The mean $\mu$ is the centre of a distribution, and moving it slides a normal curve left or right.
    The standard deviation $\sigma$ is its spread, and raising it makes the curve wider and flatter.

- term: "Rule of 68 and 95 percent"
  week: 1
  tags: [probability]
  def: |
    For any normal distribution, about 68 percent of the probability lies within one standard deviation of the mean, and about 95 percent within two.
    It is why $\mathcal{N}(5, 2)$ reads as "5, plus or minus about 4".

- term: "Standard normal distribution"
  week: 1
  tags: [probability]
  def: |
    The normal distribution with mean 0 and standard deviation 1, $\mathcal{N}(0, 1)$.
    Every other normal distribution is that same shape, shifted and stretched.

- term: "Standardising"
  week: 1
  tags: [probability, data]
  def: |
    Subtracting the mean and dividing by the standard deviation, $z_i = (x_i - \mu) / \sigma$, which turns any normal variable into a standard normal one.
    A value of $z_i = 2$ then means the same thing everywhere: two standard deviations above the mean.

- term: "Prior"
  week: 1
  tags: [prior, model]
  def: |
    The distribution expressing what is plausible about a parameter before seeing the data.
    A prior is a philosophical commitment, so it is defended on principled grounds rather than chosen for convenience.

- term: "Likelihood"
  week: 1
  tags: [probability, model]
  def: |
    How probable the observed data would be, for each candidate value of the parameters.
    It is the part of the model that lets the data speak.

- term: "Posterior"
  week: 1
  tags: [probability, model]
  def: |
    The distribution of the parameters after conditioning on the data.
    This is what Bayes' theorem returns, and every quantity of interest is computed from it.

- term: "Bayes' theorem"
  week: 1
  tags: [probability]
  def: |
    The rule that combines prior and likelihood into a posterior.
    Read as a proportionality, the posterior is the likelihood times the prior, up to a constant.

- term: "Linear regression"
  week: 1
  tags: [regression]
  def: |
    A model in which the expected outcome is a straight-line function of the predictors.
    The foundation the later models extend rather than replace.

- term: "Linear predictor"
  week: 1
  tags: [regression, model]
  def: |
    The part of a regression model that computes the expected outcome from the predictors, such as $\mu_i = \alpha + \beta \times x_i$.
    Everything the predictors do not account for is left to the spread of the outcome around it.

- term: "Intercept"
  week: 1
  tags: [regression, interpretation]
  def: |
    The expected outcome when every predictor is zero.
    It is only interpretable when zero is a meaningful value, which is one reason predictors are often centred.

- term: "Coefficient"
  week: 1
  tags: [regression, interpretation]
  def: |
    A parameter multiplying a predictor, describing how the expected outcome changes as that predictor changes by one unit.
    In a bivariate model it is the slope of the line, and in a Bayesian model it has a full posterior, not a single value.

- term: "Prior predictive check"
  week: 1
  tags: [prior, diagnostics]
  def: |
    Simulating data from the priors alone, before fitting, to see what outcomes the model considers plausible.
    It catches priors that imply impossible values, such as a turnout rate above 100 percent.

- term: "Posterior predictive check"
  week: 1
  tags: [diagnostics, model]
  def: |
    Simulating data from the fitted model and comparing it against the observed data.
    It asks whether the model can reproduce the features of the data you care about.

- term: "Markov chain Monte Carlo"
  week: 1
  tags: [mcmc]
  def: |
    A family of algorithms, usually shortened to MCMC, that explore the posterior by taking a long, dependent random walk through it.
    We need it because most interesting posteriors cannot be written down in closed form.

- term: "Chain"
  week: 1
  tags: [mcmc]
  def: |
    One run of the sampler, producing a sequence of draws.
    Several chains are run from different starting points so their agreement can be checked.

- term: "Trace plot"
  week: 1
  tags: [mcmc, diagnostics]
  def: |
    A plot of drawn values against iteration, one line per chain.
    Well-mixed chains overlap and look stationary, like noise around a stable level.

- term: "Credible interval"
  week: 1
  tags: [interpretation, probability]
  def: |
    A range containing a stated share of the posterior probability, for example 90 percent.
    It is a direct statement about the parameter given the data and the model, which is what makes it straightforward to interpret.
    A frequentist confidence interval is a different object, describing the long-run behaviour of the procedure rather than the parameter.

- term: "`brms`"
  week: 1
  tags: [r, model]
  def: |
    The R package used throughout this course to fit Bayesian regression models with familiar formula syntax.
    Every model call here sets its priors explicitly.

- term: "Reproducible research"
  week: 1
  tags: [workflow]
  def: |
    Research whose results can be regenerated from the raw data and the code alone, by someone else, on another machine.
    The practical test is whether one command rebuilds every number and figure in the output.

- term: "GitHub"
  week: 1
  tags: [git]
  def: |
    The platform that hosts Git repositories and adds collaboration features such as issues and automated checks.
    Course materials are distributed and homework submitted through it.

- term: "Template repository"
  week: 1
  tags: [git]
  def: |
    A repository GitHub can copy to make a fresh, independent repository with no shared history.
    Every homework starter is distributed this way, which is why your submission repo is yours alone.

# --- Week 2: Quarto, Git and GitHub ------------------------------------------

- term: "Positron"
  week: 2
  tags: [workflow]
  def: |
    The editor this course works in, built for data science in R and Python.
    Its panes include the editor, the terminal, the console, the file explorer and the Source Control pane.

- term: "Terminal"
  week: 2
  tags: [workflow]
  def: |
    A text interface that talks to your computer, with commands such as `ls`, `cd` and `clear`.
    It is not the console: the terminal runs system commands such as `quarto render`, and the console runs R.

- term: "Console"
  week: 2
  tags: [r, workflow]
  def: |
    The place where R code runs line by line and prints its result straight away.
    Use it for one-off commands such as `install.packages()`, and keep anything that belongs to the analysis in the document.

- term: "Working directory"
  week: 2
  tags: [r, workflow]
  def: |
    The folder a terminal or R currently treats as "here" when it resolves a relative path.
    It changes depending on how code is run, which is exactly why we do not rely on it.

- term: "Literate programming"
  week: 2
  tags: [workflow, quarto]
  def: |
    Writing code, the prose that explains it and its results in a single document, so the reasoning and the computation cannot drift apart.
    Quarto is the tool we use for it.

- term: "Quarto"
  week: 2
  tags: [quarto]
  def: |
    The publishing system that turns a `.qmd` file into HTML, PDF or slides, running the embedded code as it goes.
    Everything in this course, including this page, is a Quarto document.

- term: "Markdown"
  week: 2
  tags: [quarto]
  def: |
    The plain-text formatting syntax used in the body of a `.qmd`: `*italics*`, `**bold**`, `#` for headings, and so on.
    It stays readable as source and still renders to a formatted document.

- term: "YAML header"
  week: 2
  tags: [quarto]
  def: |
    The block between the two `---` lines at the top of a `.qmd`, which sets the document title, output format and options.
    It is configuration, not content, and is also called the front matter.

- term: "Render"
  week: 2
  tags: [quarto, workflow]
  def: |
    The act of turning a source `.qmd` into its output document, from the Preview button in Positron or with `quarto render` in the terminal.
    A submission that does not render is not a submission, because nobody else can reproduce it.

- term: "Output format"
  week: 2
  tags: [quarto]
  def: |
    The kind of document a render produces, such as HTML, PDF or Word, set with `format:` in the YAML header.
    The source stays the same whatever the format, which is the point of one source and several outputs.

- term: "Cross-reference"
  week: 2
  tags: [quarto]
  def: |
    A link from the text to a labelled figure, table, equation or section, written as `@fig-example`.
    A label survives reordering and a phrase such as "the figure below" does not.

- term: "Code cell"
  week: 2
  tags: [quarto, r]
  def: |
    A block of executable code inside a `.qmd`, also called a code chunk.
    Every cell in this course carries a label, so it can be referred to and so an error points somewhere specific.

- term: "Git"
  week: 2
  tags: [git]
  def: |
    A version control system that records the history of a project as a series of snapshots.
    It answers what changed, when, and why, and it lets you go back.

- term: "Repository"
  week: 2
  tags: [git]
  def: |
    A project under version control, together with its full history.
    Usually shortened to "repo".

- term: "Local repository"
  week: 2
  tags: [git]
  def: |
    The copy of a repository on your own computer, where you edit files and make commits.
    Your commits live only here until you push them to the remote.

- term: "Diff"
  week: 2
  tags: [git]
  def: |
    A comparison of two versions of a file, showing what was removed, what was added and where.
    Reading the diff before you commit is how you check that a commit contains what you think it does.

- term: "Commit"
  week: 2
  tags: [git]
  def: |
    One recorded snapshot of the project: the changes, who made them, when, and a message saying what changed.
    A commit is the unit of history, so it should be a meaningful checkpoint.

- term: "Commit message"
  week: 2
  tags: [git, workflow]
  def: |
    The short text attached to a commit, written for a future reader, most importantly future you.
    "Add figure and cross-reference to introduction" helps, "Update" does not, and it is also where AI assistance gets declared.

- term: "One sentence per line"
  week: 2
  tags: [quarto, git]
  def: |
    Writing prose in a `.qmd` with each sentence on its own source line.
    The rendered document looks the same, but Git can now show a change sentence by sentence.

- term: "Remote"
  week: 2
  tags: [git]
  def: |
    A copy of the repository hosted elsewhere, normally on GitHub, that you push to and pull from.
    The remote is what makes the work shared rather than local.

- term: "Push and pull"
  week: 2
  tags: [git]
  def: |
    Sending your local commits to the remote (push), and fetching commits from it into your local repository (pull).
    The Sync button in Positron does both.

- term: "Clone"
  week: 2
  tags: [git]
  def: |
    Making a local copy of a remote repository, including its history.

- term: "Branch"
  week: 2
  tags: [git]
  def: |
    A named line of development inside a repository, so work in progress does not disturb the main version.
    This course uses `main` for sources and `gh-pages` for the rendered website.

- term: "Freeze"
  week: 2
  tags: [quarto, workflow]
  def: |
    Quarto's cache of already-computed results, stored in `_freeze/`, so a rebuild does not re-run expensive code.
    It is committed deliberately, so the site rebuilds identically anywhere.

# --- Week 3: R fundamentals --------------------------------------------------

- term: "Object"
  week: 3
  tags: [r]
  def: |
    A named container holding information, with a name, a value and a type.
    In R, everything that exists is an object, including functions and fitted models.

- term: "Assignment"
  week: 3
  tags: [r]
  def: |
    Storing a value under a name with `<-`, read aloud as "gets": `country <- "Germany"`.
    Assigning to a name that already exists overwrites it without asking.

- term: "Function and argument"
  week: 3
  tags: [r]
  def: |
    A function is a named, reusable piece of code that takes inputs, its arguments, and returns an output.
    Arguments can be given by position or by name, and naming them makes code readable a month later.

- term: "Help page"
  week: 3
  tags: [r]
  def: |
    The documentation every R function has, opened with `?mean` or `help(mean)`.
    The Usage section shows the arguments and their defaults, and the Examples at the bottom are usually the fastest way in.

- term: "Error and warning"
  week: 3
  tags: [r]
  def: |
    An error stops the code and nothing is computed, while a warning lets the code finish but flags something suspicious.
    Read an error in two parts, where it broke and what went wrong, before you change anything.

- term: "Native pipe"
  week: 3
  tags: [r]
  def: |
    The `|>` operator, which passes the result on its left into the first argument of the function on its right, so a sequence of steps reads left to right, as "and then".
    This course uses `|>` throughout and not the older `%>%`.

- term: "Data type"
  week: 3
  tags: [r, data]
  def: |
    What kind of information a value is: `double`, `integer`, `character` or `logical`, plus `factor` and `Date` built on top of them.
    `class()` tells you which one you have.

- term: "Double and integer"
  week: 3
  tags: [r, data]
  def: |
    R's two numeric types: `double` for decimal numbers, the default, and `integer` for whole numbers, written with an `L` as in `42L`.
    The difference rarely matters here, but whether a value is numeric at all does, and `is.numeric()` answers that.

- term: "Character"
  week: 3
  tags: [r, data]
  def: |
    R's type for text, also called a string, always written in quotes: `"Germany"`.
    A number in quotes is text, so `"42" + 1` is an error until `as.numeric()` converts it.

- term: "Logical"
  week: 3
  tags: [r, data]
  def: |
    R's type for true or false, `TRUE` and `FALSE`, which every comparison returns.
    Logicals are the backbone of filtering, and `sum()` of a logical vector counts its `TRUE` values.

- term: "Comparison and logical operators"
  week: 3
  tags: [r]
  def: |
    Operators that return `TRUE` or `FALSE`: `<`, `>`, `==`, `!=`, `%in%`, combined with `&` (and), `|` (or) and `!` (not).
    Note that `=` assigns and `==` compares.

- term: "Factor"
  week: 3
  tags: [r, data]
  def: |
    R's type for categories with a fixed set of levels, such as autocracy, hybrid and democracy.
    Stored this way, categories can be ordered and counted, and the level order controls how they appear in tables and plots.

- term: "Date"
  week: 3
  tags: [r, data]
  def: |
    R's type for calendar dates, created with `as.Date("1957-03-25")`.
    A date knows about the calendar, so dates can be sorted and subtracted.

- term: "`NA`"
  week: 3
  tags: [r, data]
  def: |
    R's marker for a missing value, "not available".
    It appears when a value was never recorded, when a conversion fails, and when a join finds no match, so always check how many you have.

- term: "Coercion"
  week: 3
  tags: [r, data]
  def: |
    R converting values from one type to another, silently when a vector mixes types.
    `c(1, 2, "three")` becomes all text, and `c(1, TRUE, FALSE)` becomes the numbers 1, 1 and 0.

- term: "Data structure"
  week: 3
  tags: [r, data]
  def: |
    How R organises values: from a single value, through vectors, matrices and arrays, to data frames and lists.
    Each step adds a dimension or, for data frames and lists, the freedom to mix types.

- term: "Scalar"
  week: 3
  tags: [r, data]
  def: |
    A single value, written in italic lowercase as $x$ in this course.
    R has no scalars: a single value is a vector of length 1, so everything that works on a vector works on one value too.

- term: "Vector"
  week: 3
  tags: [r, data]
  def: |
    An ordered set of values of one type, created with `c()` and written in bold lowercase as $\mathbf{x}$.
    It is the building block of R, and arithmetic on a vector works on every element at once.

- term: "Matrix"
  week: 3
  tags: [r, data]
  def: |
    A two-dimensional arrangement of values of one type, in rows and columns, created with `matrix()` and written in bold uppercase as $\mathbf{X}$.
    It is the workhorse of linear algebra, and of every regression under the hood.

- term: "Array and tensor"
  week: 3
  tags: [r, data]
  def: |
    The generalisation of a matrix to three or more dimensions, created in R with `array()`.
    In mathematics it is called a tensor and written in calligraphic as $\mathcal{X}$, and this course rarely needs one.

- term: "Data frame and tibble"
  week: 3
  tags: [data, r]
  def: |
    A rectangular table of data in R, in which each column is a vector with its own type, so a dataset can mix numbers, text and logicals.
    A tibble is the tidyverse version of a data frame, with friendlier printing and fewer surprises.

- term: "List"
  week: 3
  tags: [r, data]
  def: |
    R's flexible container, created with `list()`, which can hold anything, including other lists.
    You will rarely build one yourself, but every fitted model in this course comes back as one.

- term: "Observation"
  week: 3
  tags: [data]
  def: |
    One unit of what was measured, such as one country in one year.
    In a tidy dataset each observation has its own row.

- term: "Variable"
  week: 3
  tags: [data]
  def: |
    One characteristic measured across observations, such as population or regime type.
    In a tidy dataset each variable has its own column.

- term: "Indexing"
  week: 3
  tags: [r, data]
  def: |
    Picking values out of a structure: `[ ]` by position or by condition, and `$` by name, for data frames and lists.
    A logical vector inside `[ ]` keeps the elements where it is `TRUE`, which is filtering.

- term: "Package"
  week: 3
  tags: [r]
  def: |
    A bundle of functions, their help pages and sometimes data, that someone wrote and shared.
    Installed once with `install.packages()` in the console, loaded every session with `library()` in the document.

# --- Week 4: The tidyverse ---------------------------------------------------

- term: "Cell option"
  week: 4
  tags: [quarto]
  def: |
    A `#|` line at the top of a code cell that controls it, such as `label:`, `echo: false` or `fig-cap:`.
    Set under `execute:` in the YAML header, an option applies to every cell instead.

- term: "Pandoc"
  week: 4
  tags: [quarto]
  def: |
    The document converter Quarto runs after R has executed the cells, turning Markdown into HTML, Word or LaTeX.
    An error mentioning YAML usually comes from this layer, and points at a line and column of the header.

- term: "LaTeX"
  week: 4
  tags: [quarto]
  def: |
    The typesetting system that turns the converted document into a PDF, the last layer of a PDF render.
    Its errors usually come from a special character in your prose, such as `%`, `&`, `$` or a stray backslash.

- term: "Base R"
  week: 4
  tags: [r]
  def: |
    The functions R ships with before any package is installed, such as `mean()`, `round()` and `data.frame()`.

- term: "CRAN"
  week: 4
  tags: [r]
  def: |
    The Comprehensive R Archive Network, R's official package archive, holding more than 20,000 checked and free packages.
    `install.packages()` downloads from it.

- term: "`package::function()`"
  week: 4
  tags: [r]
  def: |
    Calling a function by naming the package it lives in, as in `readxl::read_excel()`.
    It makes the source clear, needs no `library()` for a one-off call, and settles which function you mean when two packages share a name.

- term: "Masking"
  week: 4
  tags: [r]
  def: |
    What happens when a loaded package has a function with the same name as one already available, so the newer one wins.
    `library(tidyverse)` reports, for example, that `dplyr::filter()` masks `stats::filter()`.

- term: "Tidyverse"
  week: 4
  tags: [r, data]
  def: |
    A family of R packages built on one shared philosophy: tidy data in and out, the data as the first argument, and functions named as verbs.
    `library(tidyverse)` loads the core packages, including `readr`, `tidyr`, `dplyr` and `ggplot2`, in one line.

- term: "Tidy data"
  week: 4
  tags: [data]
  def: |
    Data arranged so that each variable is a column, each observation is a row, and each value has its own cell.
    Most of the work in an analysis is getting data into this shape, and most tools assume it.

- term: "Wide and long format"
  week: 4
  tags: [data]
  def: |
    Wide data spreads one variable across several columns, for example one column per year, and long data stacks it into one column with a second column saying which year.
    Keep working data long and tidy, and go wide only for a table meant for a reader.

- term: "Project root"
  week: 4
  tags: [workflow, r]
  def: |
    The top folder of a project, the fixed point every other path is expressed relative to.
    Anchoring paths to it is what makes a project work on a machine other than yours.

- term: "`here()`"
  week: 4
  tags: [r, workflow]
  def: |
    The function from the `here` package that builds a path from the project root rather than from whatever the current working directory happens to be.
    Use it for every path, always.

- term: "CSV"
  week: 4
  tags: [data]
  def: |
    Comma-separated values: a plain-text file with one row per line and the columns separated by commas.
    Any program can read it, which makes it the most common way to share a dataset.

- term: "`read_csv()`"
  week: 4
  tags: [r, data]
  def: |
    The `readr` function that reads a CSV file, from disk or a URL, into a tibble, guessing each column's type.
    Assign the result, because on its own it prints the data and forgets it.

- term: "`glimpse()`"
  week: 4
  tags: [r, data]
  def: |
    Shows every column of a table with its type and its first values.
    The first thing to run on data you have just read.

- term: "`pivot_longer()` and `pivot_wider()`"
  week: 4
  tags: [r, data]
  def: |
    The `tidyr` functions that reshape a table: `pivot_longer()` turns wide data into long, tidy data, and `pivot_wider()` goes the other way.
    Column names become values of a new variable on the way to long, and values of a variable become column names on the way back.

- term: "`dplyr`"
  week: 4
  tags: [r, data]
  def: |
    The tidyverse package for data manipulation, a set of verbs such as `filter()`, `select()`, `mutate()` and `summarise()`.
    Every verb takes a table first, names columns without quotes, and returns a new table, leaving the old one unchanged.

- term: "`filter()`"
  week: 4
  tags: [r, data]
  def: |
    Keeps the rows of a table that meet a condition built from comparison and logical operators.
    A comma between conditions means and, `|` means or.

- term: "`select()`"
  week: 4
  tags: [r, data]
  def: |
    Keeps or drops columns of a table, by name.

- term: "`mutate()`"
  week: 4
  tags: [r, data]
  def: |
    Creates new columns or changes existing ones.
    A new name creates a column, and an existing name overwrites it.

- term: "`arrange()`"
  week: 4
  tags: [r, data]
  def: |
    Sorts the rows of a table by one or more columns, ascending by default.
    Wrap a column in `desc()` to sort it descending.

- term: "Join"
  week: 4
  tags: [data]
  def: |
    Combining two tables by matching rows on a shared key column.
    The four joins of `dplyr` differ only in which rows survive when a key has no partner in the other table.

- term: "Key"
  week: 4
  tags: [data]
  def: |
    The column, or columns, a join matches rows on, such as `country`.
    A key matches text exactly, so one spelling difference silently produces `NA`.

- term: "`left_join()`"
  week: 4
  tags: [r, data]
  def: |
    Keeps every row of the left table and adds the matching columns of the right one, with `NA` where there is no match.
    It is nearly always the join you want, and afterwards you check how many `NA` values it produced.

- term: "`count()`"
  week: 4
  tags: [r, data]
  def: |
    Counts the rows for each value of a column, returning one row per value with the number in a column called `n`.

- term: "`group_by()`"
  week: 4
  tags: [r, data]
  def: |
    Splits a table into groups by the values of one or more columns.
    It changes nothing you can see, but tells the next verb, usually `summarise()`, to work once per group.

- term: "`summarise()`"
  week: 4
  tags: [r, data]
  def: |
    Reduces a table to summary statistics, such as a mean, with one row for the whole table or one per group after `group_by()`.
    Inside it, `n()` counts the rows of each group.

- term: "Pipeline"
  week: 4
  tags: [r, workflow]
  def: |
    A sequence of steps chained with `|>`, each taking the previous result, from reading a file to a finished table.
    Pipelines are powerful, so build them one step at a time and check the result at every step.

# --- Later weeks: planned week from course.yml -------------------------------

- term: "`set.seed()`"
  week: 6
  tags: [r, workflow]
  def: |
    Fixes the starting point of R's random number generator, so anything involving randomness gives the same result on every run.
    Required wherever this course simulates or samples.

- term: "Normalising constant"
  week: 6
  tags: [probability]
  def: |
    The quantity that rescales the posterior so it integrates to one.
    It does not depend on the parameters, which is why we can usually ignore it and work with the unnormalised posterior.

- term: "Generative model"
  week: 6
  tags: [model]
  def: |
    A model complete enough to simulate fake data that looks like the real thing.
    If you can simulate from it, you can check it before it ever touches your data.

- term: "Warmup"
  week: 7
  tags: [mcmc]
  def: |
    The initial draws a chain uses to adapt and find the posterior, discarded before inference.
    They describe the sampler getting started, not the posterior.

- term: "Draw"
  week: 7
  tags: [mcmc]
  def: |
    A single sample from the posterior.
    A posterior is represented in practice as a large collection of draws, and every summary is computed from them.

- term: "Divergent transition"
  week: 7
  tags: [mcmc, diagnostics]
  def: |
    A warning that the sampler failed to explore part of the posterior faithfully.
    Divergences are not cosmetic, so they are understood rather than silenced.

- term: "R-hat"
  week: 7
  tags: [mcmc, diagnostics]
  def: |
    A convergence diagnostic comparing variation between chains against variation within them.
    Values near 1 are consistent with convergence, and clearly larger values mean the chains do not agree.

- term: "Effective sample size"
  week: 7
  tags: [mcmc, diagnostics]
  def: |
    How many independent draws the correlated MCMC draws are worth.
    A low value means a summary rests on less information than the raw number of draws suggests.

- term: "Stan"
  week: 7
  tags: [mcmc, model]
  def: |
    The probabilistic programming language and sampler that `brms` compiles models down to and runs.
    You will rarely write Stan code directly, but its diagnostics are the ones you read.

- term: "Marginal effect"
  week: 8
  tags: [interpretation]
  def: |
    How the expected outcome changes with a predictor, after averaging over the others.
    It is often the form in which a result becomes reportable.

- term: "Quantity of interest"
  week: 8
  tags: [interpretation]
  def: |
    The specific, interpretable number a reader should take away, computed from the posterior.
    Deciding it in advance is what stops an analysis becoming a table of coefficients with no conclusion.

- term: "Counterfactual prediction"
  week: 8
  tags: [interpretation, model]
  def: |
    A model-based prediction of the outcome under a specified, possibly unobserved, setting of the predictors.
    It is how a fitted model answers a substantive question.

- term: "Posterior predictive distribution"
  week: 8
  tags: [interpretation, model]
  def: |
    The distribution of new outcomes implied by the fitted model, accounting for both parameter uncertainty and outcome variability.
    Predictions come from it rather than from point estimates alone.

- term: "Directed acyclic graph"
  week: 9
  tags: [workflow, model]
  def: |
    A diagram of assumed causal relationships, drawn as arrows between variables with no cycles.
    Usually called a DAG, it makes explicit which variables must be adjusted for and which must not.

- term: "Confounder"
  week: 9
  tags: [model, interpretation]
  def: |
    A variable that influences both the presumed cause and the outcome, so leaving it out distorts the relationship you are trying to measure.
    Whether a variable is a confounder is a claim about the DAG, not something the data can tell you.

- term: "Interaction"
  week: 10
  tags: [regression, interpretation]
  def: |
    A term letting the effect of one predictor depend on the value of another.
    An interaction is a claim that an effect is conditional, so it is interpreted jointly and not term by term.

- term: "Link function"
  week: 11
  tags: [regression, model]
  def: |
    The transformation connecting a linear predictor to the scale of the outcome.
    It lets a linear model describe outcomes that are bounded, such as probabilities.

- term: "Logistic regression"
  week: 11
  tags: [regression]
  def: |
    A model for a binary outcome, using the logit link to keep predicted probabilities between zero and one.

- term: "Log-odds"
  week: 11
  tags: [regression, interpretation]
  def: |
    The scale a logistic regression's coefficients live on, the logarithm of the odds.
    Coefficients are additive here but not on the probability scale, which is why results are converted before interpretation.

- term: "Multilevel model"
  week: 12
  tags: [multilevel]
  def: |
    A model with parameters that vary by group, where the group-level variation is itself estimated.
    Also called a hierarchical model.

- term: "Partial pooling"
  week: 12
  tags: [multilevel]
  def: |
    The compromise a multilevel model strikes between one estimate for all groups and a separate, independent estimate per group.
    Groups with little data are pulled towards the overall pattern, and groups with plenty are left largely alone.

- term: "Shrinkage"
  week: 12
  tags: [multilevel]
  def: |
    The pull of a group's estimate towards the overall mean under partial pooling.
    It is a feature, because it stops small groups producing extreme estimates on thin evidence.

- term: "Population-level and group-level effects"
  week: 12
  tags: [multilevel, model]
  def: |
    Population-level effects apply across all observations, and group-level effects vary by group.
    `brms` uses these names for what are elsewhere called fixed and random effects.
