# Mechanical homework check. This file SHIPS INSIDE each distribution repo (hw-NN) and runs
# in the student's own repo on every push. It lives under homework/_template/ rather than at
# the root of the course repo on purpose: at the root it would fire on every course commit
# and fail, since there is no hw-*.qmd here.
#
# It checks only that the submission is HEALTHY — not whether the analysis is correct.
# Substantive assessment is always the sample solution + opt-in AI feedback.
name: hw-check

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      # Render the homework — the single most useful mechanical check.
      - name: Render submission
        run: quarto render hw-*.qmd
      # Emit a tiny status artifact (green = rendered).
      - name: Mark rendered
        run: echo '{"rendered": true}' > check-result.json
      - uses: actions/upload-artifact@v4
        with: { name: check-result, path: check-result.json }
