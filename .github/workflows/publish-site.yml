# Optional: publish the website via CI instead of a local `quarto publish`.
# Only deploys rendered output — solutions in homework/ and exam/ are never rendered into the site.
# Enable by adding a deploy token/secret for the public Pages repo, or run automation/publish-site.ps1 locally.
name: publish-site

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["website/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
      # Render website/ only; do NOT render homework/ or exam/.
      - run: quarto render website
      # Deploy website/_site to the public Pages repo (configure target + token).
      # - uses: quarto-dev/quarto-actions/publish@v2
      #   with: { target: gh-pages, path: website }
