# Mechanical homework check (the plain-GitHub fallback autograder — CLAUDE.md §6).
# Ships INSIDE each distribution repo (release-homework can add it). Runs on the student's push.
# It checks only that the submission is healthy — NOT whether the analysis is correct.
# Substantive assessment is always the sample solution + opt-in AI feedback.
name: hw-check

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      # If the repo uses renv, restore it (proves the environment is reproducible).
      - name: Restore renv (if present)
        run: if [ -f renv.lock ]; then Rscript -e 'install.packages("renv"); renv::restore()'; fi
        shell: bash
      # Render the homework — the single most useful mechanical check.
      - name: Render submission
        run: quarto render hw-*.qmd
      # Emit a tiny status artifact (green = rendered). Extend with light testthat checks if wanted.
      - name: Mark rendered
        run: echo '{"rendered": true}' > check-result.json
      - uses: actions/upload-artifact@v4
        with: { name: check-result, path: check-result.json }
