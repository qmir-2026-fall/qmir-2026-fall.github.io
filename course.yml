# ─────────────────────────────────────────────────────────────────────────────
# QMIR 2026-fall — the single source of truth for term-level constants.
#
# Read by:  website/schedule.qmd  ·  website/index.qmd  ·  website/syllabus.qmd
#           website/glossary.qmd  ·  tracking/progress.qmd  ·  the automation scripts
# (-Org / -SiteUrl defaults). Change a value HERE, never in the consumers.
# ─────────────────────────────────────────────────────────────────────────────

course:
  title: "QMIR — Quantitative Methods"
  term: "Fall 2026"
  instructor: "Tristan Muno"
  # Shown on the about page. Purely descriptive.
  department: "Department of Political Science"
  school: "School of Social Sciences"
  university: "University of Mannheim"
  email: "tristan.muno@uni-mannheim.de"
  office: "A 5, 6 — Room A 351"
  # Module facts shown in the syllabus logistics section. PLACEHOLDER prints as an
  # honest "to be announced" via shown(), so fill these in HERE rather than in prose.
  #
  # Source: Modulkatalog B.A. Politikwissenschaft (HWS 2023), pp. 31-33. This course
  # is the Uebung "Methoden der Internationalen Beziehungen" inside the Aufbaumodul
  # "Internationale Beziehungen". The Schwerpunktmodul IB has no Uebung, so there is
  # no ambiguity about which entry applies.
  module: "Advanced Module: International Relations"
  course_type: "Methods exercise class (Übung)"
  target_semester: "5th Semester"
  # NUMBERS, not strings: the workload figures in the syllabus are COMPUTED from
  # these by workload() in website/_course-helpers.R, never typed into prose.
  ects: 6
  ects_hours: 30 # hours of student workload one ECTS credit represents
  # The catalogue's own nominal budget for a 6 ECTS course. Our real contact time is
  # lower (13 x 90 min = 19.5 h), so the syllabus prints both and explains the gap.
  nominal_contact_hours: 30
  nominal_self_study_hours: 150

github:
  org: qmir-2026-fall
  # The monorepo is PUBLIC and is itself the Pages repo: Pages serves the gh-pages
  # branch of <org>/<org>.github.io at the apex URL below.
  repo: qmir-2026-fall.github.io
  site_url: "https://qmir-2026-fall.github.io/"
  # Distribution repos: hw-NN (template) -> student repos hw-NN-<username>.
  hw_repo_pattern: "hw-{week}"
  student_repo_pattern: "hw-{week}-{username}"

# One session per week (CLAUDE.md §1 — no more Mon/Thu doubling).
sessions:
  # 13 TAUGHT sessions across 14 calendar dates, 9 Sep to 9 Dec 2026.
  count: 13
  weekday: Wednesday
  # Length of one session, in minutes. Feeds the contact-time half of workload().
  minutes: 90
  # First session. The term runs weekly from here, and week N is the Nth weekly date
  # AFTER removing everything in skip_dates. That arithmetic lives in exactly one
  # place, session_dates() in website/_course-helpers.R, so no page computes its own.
  first_session: 2026-09-09
  # Dates on the weekly grid that are NOT taught. The schedule prints each as a greyed
  # "no session" row, so a gap in the dates is explained rather than mysterious.
  skip_dates:
    - 2026-10-28 # instructor at a congress
  time: "13:45-15:15"
  room: "A 5, 6 -- C 108"
  office_hours: "By appointment. Please email me to arrange a meeting (in person or online). I aim to reply within 24 hours."

homework:
  # ONE homework per session, in every session except the first and the last. Session 1 is
  # orientation and session 13 is synthesis plus the exam briefing, so neither sets work.
  # That makes the window weeks 2 to 12, and the count is last_week - first_week + 1 = 11.
  # Keep the three in step: syllabus.qmd and schedule.qmd read all of them.
  first_week: 2
  last_week: 12
  count: 11
  # Default offset from the session for a homework's due date, in days.
  due_offset_days: 7

# The take-home exam window. The 2026 spring iteration kept THREE conflicting exam
# dates across syllabus.qmd, schedule.qmd and CLAUDE.md. One source, here.
# These are strings, not dates: the pages print them verbatim and do no arithmetic.
# The window follows the 2026 spring pattern: it opens as the last session ends and
# runs for 14 days. Last session is 9 Dec 2026, which ends at 15:15.
exam:
  opens: "9 December 2026, 15:30"
  closes: "23 December 2026, 23:59"
  # The binding length limit, from the Modulkatalog entry for this Uebung: the
  # Pruefungsleistung is a "schriftliche Hausarbeit (max. 6000 Woerter)".
  max_words: 6000

# Pass thresholds (fractions of the totals above).
thresholds:
  attendance: 0.80
  homework: 0.80

# The three teaching blocks, carried over from the 2026 spring schedule. Week 1 sits
# outside them (orientation: the whole workflow shown up front).
# Consumed by website/schedule.qmd AND website/glossary.qmd, so the block names are
# written once and cannot drift apart.
blocks:
  - name: "Scientific programming fundamentals"
    from: 2
    to: 5
  - name: "The logic of Bayesian inference"
    from: 6
    to: 7
  - name: "Applied modelling"
    from: 8
    to: 13

# Planned topic per week. The deck's OWN YAML title wins once website/slides/weekNN.qmd
# exists -- that is the E040 contract in STYLE.md §5.4. This list is the forward plan
# shown on the schedule until the deck is written.
#
# Each entry also carries the session plan rendered by website/syllabus.qmd:
#   steps:    which of the 8 workflow steps (CLAUDE.md §3) the session foregrounds
#   goals:    learning goals, addressed to the student ("You will be able to ...")
#   content:  one or two sentences on what the session actually covers
#
# Goals are carried over from the 2026 spring decks (qmir-2026/.../slides/weekNN.qmd)
# and re-cut to the session structure of this term. Sessions 8 and 13 carry classical
# statistics deliberately, as CONTRAST rather than substitution (CLAUDE.md §3).
weeks:
  - week: 1
    topic: "Introduction"
    steps: [1, 2]
    content: |
      An orientation session built around a short welcome survey we fill in together.
      The responses give us a dataset of our own, and we run the whole eight-step workflow
      over it before taking any single step apart.
    goals:
      - "Recognise the main types of data a survey produces, and why the type constrains what you can do with it."
      - "Follow the eight steps of a Bayesian analysis end to end on a dataset we collected in the room."
      - "Say how the course is structured, what the take-home exam asks for, and why the two match."
      - "Find your way around the course site: schedule, syllabus, glossary and the homework flow."
      - "Get started with the basics: files and folders, the terminal, working directories, and what Quarto does."
  - week: 2
    topic: "Reproducible literate programming with Quarto and Git"
    steps: []
    content: |
      The working environment, and the habits that make a result checkable by somebody else.
      Everything happens in Positron from this session onwards.
    goals:
      - "Understand how Quarto, R, Git and GitHub fit together."
      - "Create a project under version control and render a Quarto document."
      - "Push your first reproducible document to GitHub, and generate your own homework repository from a template."
      - "Write a commit message a later reader can follow, which is also where AI assistance gets declared."
  - week: 3
    topic: "R fundamentals: data structures, objects and functions"
    steps: []
    content: |
      The language itself, and the small vocabulary everything later is assembled from.
      Time is spent deliberately on reading errors, because that is the skill that makes
      independent work possible.
    goals:
      - "Understand the core concepts: objects, functions and pipes."
      - "Know the main data types R uses to store information."
      - "Know the main data structures R uses to organise information."
      - "Access and explore data using `[]` and `$`."
      - "Read an error message and work out what R was actually asked to do."
  - week: 4
    topic: "The tidyverse"
    steps: [2]
    content: |
      Getting data into a shape that tools can work with, which is most of the work in most
      analyses. Step 2 of the workflow, the data summary, starts here.
    goals:
      - "Understand what the tidyverse is and why it exists."
      - "Know what tidy data means and why it matters."
      - "Import data with `readr` and explore it with `glimpse()`, `head()` and `summary()`."
      - "Wrangle data with the core `dplyr` verbs, chained with the native pipe."
      - "Use Quarto cell options for labels, captions and execution control."
  - week: 5
    topic: "Data visualisation"
    steps: [2]
    content: |
      Moving from a plot that displays data to a figure that makes a point, plus the reshaping
      and joining that usually comes first. We close on probabilities and distributions, which
      is the bridge into the second block.
    goals:
      - "Reshape data between wide and long form with `pivot_longer()` and `pivot_wider()`."
      - "Combine datasets from several sources with `left_join()`, and verify the result."
      - "Handle missing values transparently, and understand the risks of imputation."
      - "Build and customise `ggplot2` figures through aesthetics, geoms, scales and themes."
      - "Produce publication-ready tables and embed computed results directly in prose with inline code."
      - "Read a distribution as a statement about how plausible each value is."
  - week: 6
    topic: "The logic of Bayesian inference"
    steps: [3, 4]
    content: |
      The conceptual core of the course, and a deliberate change of gear: the programming gets
      easier and the thinking gets harder. Probability as a description of uncertainty, and the
      single rule that combines what you believed beforehand with what you observed.
    goals:
      - "Articulate the distinction between frequentist and Bayesian interpretations of probability, and explain why each suits different questions."
      - "Explain why parameters are treated as uncertain quantities with distributions."
      - "Name and interpret the three core ingredients: prior, likelihood and posterior."
      - "State Bayes' theorem in full, identify each term, and explain the role of the normalising constant."
      - "Describe how the posterior changes as the prior changes and as data accumulates."
      - "Apply grid approximation in R to compute and visualise a posterior."
  - week: 7
    topic: "Markov chain Monte Carlo"
    steps: [4, 5, 6]
    content: |
      The computational implementation of everything session 6 established.
      The emphasis is on reading the diagnostics rather than on deriving the algorithms.
    goals:
      - "Articulate why grid approximation is intractable for realistic models."
      - "Explain the Monte Carlo idea: approximating integrals by random sampling and counting."
      - "Define a Markov chain and explain what a stationary distribution is."
      - "State the Metropolis acceptance rule and show why the normalising constant cancels."
      - "Explain qualitatively how Hamiltonian Monte Carlo differs from random-walk Metropolis, and why it is more efficient."
      - "Interpret `brms` output: trace plots, R-hat, effective sample size and posterior distributions."
      - "Understand that convergence cannot be proven, only falsified, and recognise what non-convergence looks like."
  - week: 8
    topic: "Bivariate linear regression"
    steps: [1, 3, 4, 5, 6]
    content: |
      The first full model, deliberately the simplest one: one outcome, one predictor, and the
      whole workflow run around it. Every later model extends this one rather than replacing it.
    goals:
      - "Frame a regression problem as estimand (what we want to know), estimator (the procedure) and estimate (the number we get)."
      - "Explain what OLS assumes, and see where the classical and the Bayesian account of the same model meet."
      - "Specify weakly informative priors for regression coefficients and defend them on principled grounds."
      - "Understand `brms` as sampling from the posterior: an estimator that returns a distribution rather than one number."
      - "Interpret `brms` output and extract quantities of interest, such as predictions and marginal effects."
  - week: 9
    topic: "Multivariate linear regression"
    steps: [1, 7]
    content: |
      More than one predictor, and the questions that come with it.
      A set of controls is a claim about how the world works, not a way of being safe.
    goals:
      - "Explain omitted variable bias, and use a DAG to classify a control variable as a confounder, a mediator or a collider."
      - "Extend the Bayesian regression model to several predictors and interpret each coefficient as a partial effect."
      - "Handle categorical predictors using dummy variables."
      - "Compare competing models with Bayesian leave-one-out cross-validation (LOO-IC)."
  - week: 10
    topic: "Interaction terms in linear regression"
    steps: [7]
    content: |
      Effects that are not the same everywhere. Specification is the easy part, and interpretation
      is where interactions are usually got wrong, so most of the session goes there.
    goals:
      - "Specify a multiplicative interaction model and interpret the conditional marginal effect of a predictor as a function of its moderator."
      - "Extract posterior marginal effects separately for each level of the moderator."
      - "Compare an interaction model against the additive model with LOO-IC."
      - "Show a conditional effect in a figure rather than asking a reader to combine coefficients."
  - week: 11
    topic: "Modelling binary outcomes: logit and probit"
    steps: [3, 7]
    content: |
      Outcomes that are yes or no. Nothing about the engine changes here: we are only swapping
      the likelihood, and then doing the work of getting back to a scale a reader can use.
    goals:
      - "Explain why linear models are structurally wrong for binary outcomes, and how a Bernoulli likelihood plus a link function resolves it."
      - "Fit and interpret a Bayesian logistic regression in `brms`, including priors on the logit scale and predicted probability ribbons."
      - "Say how the probit link differs from the logit, and when the choice matters."
      - "Assess model quality with posterior predictive checks, a confusion matrix, ROC and AUC, and compare models with LOO."
  - week: 12
    topic: "Introduction to multilevel models"
    steps: [3, 5, 7]
    content: |
      Data with structure: candidates in parties, regions in countries, years in states.
      A primer and your departure point for later work, and the one session that is not on the
      take-home exam.
    goals:
      - "Identify hierarchical data and explain why treating grouped observations as independent understates uncertainty."
      - "Describe the three-point spectrum of complete pooling, no pooling and partial pooling, and say when each is right."
      - "Read the `(1 | group)` formula in `brms` and interpret the key output quantities."
  - week: 13
    topic: "Beyond the course: applying what you have learned"
    steps: [1, 2, 3, 4, 5, 6, 7, 8]
    content: |
      Synthesis and outlook rather than new methods.
      We consolidate what you already have and hand you a clean runway into the exam.
    goals:
      - "Name what you learned across the three blocks, and why the course was built this way."
      - "Read a classical regression table, since most of the literature you will meet reports one."
      - "Use the tooling that makes the code and repository part of the exam grade straightforward."
      - "Know exactly what the exam asks for, how it is graded, and how AI use is declared in it."
